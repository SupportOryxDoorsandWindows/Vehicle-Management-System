<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Oryx Operations ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: matches the Oryx inventory app — navy icon sidebar, white title band, grey canvas, yellow primary action. Single light theme by design. */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #F8F9FA; --ink: #14242C; --head: #032A3B; --muted: #4A5862; --faint: #6B7782;
  --line: #E2E5E9; --divider: #EEF0F2; --accent: #032A3B; --accent-ink: #032A3B; --tint: #E7EEF2; --silver: #A9A9A9; --steel: #2A7AAE; --track: #ECEEF1;
  --btn-bg: #FAC253; --btn-fg: #032A3B; --btn-hover: #F2B33A; --dark: #032A3B; --dark-hover: #0E3D52;
  --nav-bg: #032A3B; --nav-active: #1C404E; --nav-line: #1A4152; --nav-text: #DCE4E8; --nav-muted: #8EA4AE; --yellow: #FAC253;
  --red: #A42A1F; --red-bg: #FBE6E3; --amber: #8A5800; --amber-bg: #FDF0D3; --green: #1F6B45; --green-bg: #DDF5E7;
  --phone: #0D1A20; --scan: #0F2630;
  --sans: "Inter", system-ui, "Segoe UI", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav-bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
.num, td.r, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
td.mono { white-space: nowrap; }

.app { display: grid; grid-template-columns: 258px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--nav-bg); color: var(--nav-text); display: flex; flex-direction: column; position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); padding-left: env(safe-area-inset-left, 0px); }
.brand { padding: 26px 24px 14px; display: grid; gap: 6px; }
.brand img { width: 64px; height: auto; display: block; }
.brand span { color: #FFFFFF; font-weight: 700; font-size: 14px; }
.nav { padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; }
.nav .grp { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-muted); padding: 16px 13px 6px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; color: var(--nav-text); padding: 10px 13px; border-radius: 8px; cursor: pointer; font-size: 14.5px; font-weight: 500; white-space: nowrap; }
.nav button svg { width: 18px; height: 18px; flex: none; color: var(--nav-muted); }
.nav button:hover:not(:disabled) { background: var(--nav-active); color: #FFFFFF; }
.nav button.on { background: var(--nav-active); color: #FFFFFF; }
.nav button.on svg { color: var(--yellow); }
.nav button:disabled { cursor: default; }
.nav .soon { margin-left: auto; padding-left: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; color: var(--nav-muted); }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.nav .dot.done { background: #6CC795; } .nav .dot.cur { background: var(--yellow); }
.side-foot { margin: 0 14px; padding: 16px 0 22px; border-top: 1px solid var(--nav-line); display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); color: var(--head); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.avatar.dk { background: var(--head); color: #FFFFFF; }
.side-foot .nm { display: grid; line-height: 1.2; min-width: 0; }
.side-foot .nm b { color: #FFFFFF; font-size: 14px; }
.side-foot .nm span { color: var(--nav-muted); font-size: 12.5px; }
.side-foot button { margin-left: auto; background: transparent; border: 1px solid var(--nav-muted); color: #FFFFFF; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .08em; white-space: nowrap; }
.side-foot button:hover { background: var(--nav-active); }

.main { min-width: 0; display: flex; flex-direction: column; }
.band { grid-template-columns: minmax(0, 1fr); background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 22px 14px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.band .row1 { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.band .t { min-width: 0; flex: 1 1 420px; }
.band .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.band .row2 { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--divider); }
h1 { font-size: 26px; line-height: 1.2; margin: 0 0 4px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; color: var(--head); }
h2 { font-size: 16px; margin: 0; font-weight: 700; color: var(--head); }
h3 { font-size: 13px; margin: 0; font-weight: 600; }
.lede { color: var(--muted); margin: 0; max-width: 80ch; font-size: 15px; }
.orderchip { display: inline-flex; align-items: center; gap: 8px; background: var(--tint); color: var(--head); border-radius: 999px; padding: 4px 12px 4px 5px; font-size: 13px; font-weight: 500; }
.orderchip b { background: var(--dark); color: #FFFFFF; border-radius: 999px; padding: 2px 9px; font-family: var(--mono); font-weight: 500; font-size: 12px; }
.sample { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); background: var(--amber-bg); padding: 4px 9px; border-radius: 999px; }
.demo { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.rail { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; max-width: 100%; }
.rail::-webkit-scrollbar { display: none; }
.rail button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 10px 2px 0; cursor: pointer; color: var(--faint); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.rail button + button::before { content: ""; width: 14px; height: 1px; background: var(--line); margin-right: 4px; }
.rail .st { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--silver); display: grid; place-items: center; font-size: 12px; flex: none; color: var(--faint); }
.rail .done { color: var(--green); } .rail .done .st { background: var(--green-bg); border-color: var(--green-bg); color: var(--green); }
.rail .cur { color: var(--head); font-weight: 700; } .rail .cur .st { border-color: var(--head); background: var(--head); color: #FFFFFF; }
.rail .here { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; text-decoration-color: var(--yellow); }

.view { padding-block: 28px 56px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; width: 100%; }

.btn { border: 1px solid #CBD1D7; background: var(--surface); color: var(--head); border-radius: 8px; padding: 9px 15px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--head); }
.btn.pri { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); padding: 11px 20px; font-size: 15px; }
.btn.pri:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn.dk { background: var(--dark); color: #FFFFFF; border-color: var(--dark); }
.btn.dk:hover { background: var(--dark-hover); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.pri.sm { padding: 7px 13px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--head); padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; overflow: hidden; }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
.card > .hd .sub { color: var(--faint); font-size: 13px; }
.card > .hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card > .bd { padding: 18px 20px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 3px; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--head); }
.kpi .d { font-size: 12.5px; color: var(--faint); }
.kpi.warn .v { color: var(--amber); } .kpi.bad .v { color: var(--red); } .kpi.good .v { color: var(--green); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 13px; color: var(--muted); padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 12px 14px; border-bottom: 1px solid var(--divider); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; white-space: nowrap; }
td.r { font-family: var(--mono); font-size: 13px; }
tr.sel td { background: #F0F5F8; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); } tr.click.sel:hover td { background: #F0F5F8; }
tfoot td { font-weight: 700; border-top: 1px solid var(--line); background: var(--surface-2); }
.pname { font-weight: 600; color: var(--head); }
.psub { color: var(--faint); font-size: 12.5px; }
input.mk { width: 66px; text-align: right; border: 1px solid #CBD1D7; border-radius: 6px; padding: 5px 7px; background: var(--surface); font-family: var(--mono); font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--track); color: var(--muted); font-family: var(--sans); }
td .pill { white-space: normal; }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.warn { background: var(--amber-bg); color: var(--amber); }
.pill.bad { background: var(--red-bg); color: var(--red); }
.pill.info { background: var(--tint); color: var(--head); }

.banner { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; background: var(--tint); color: var(--ink); flex-wrap: wrap; }
.banner.warn { background: var(--amber-bg); } .banner.ok { background: var(--green-bg); }
.banner p { margin: 0; flex: 1 1 300px; min-width: 0; }
.ai { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; }
.ai .tag { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--steel); }
.ai p { margin: 0; }

.flags { display: grid; gap: 10px; }
.flag { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); border-left: 4px solid var(--amber); }
.flag.bad { border-left-color: var(--red); background: #FFF8F7; } .flag.warn { background: #FFFCF4; } .flag.ok { border-left-color: var(--green); }
.flag p { margin: 0; } .flag > div:first-child p:first-child { font-weight: 600; color: var(--head); } .flag .psub { margin-top: 2px; }
.flag .fa { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.flag select { border: 1px solid #CBD1D7; border-radius: 6px; padding: 6px 8px; background: var(--surface); font-size: 13px; max-width: 230px; }

.bars { display: grid; gap: 11px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 60px; gap: 12px; align-items: center; font-size: 13.5px; }
.bar .tr { height: 8px; background: var(--track); border-radius: 4px; position: relative; overflow: hidden; }
.bar .fl { position: absolute; inset: 0 auto 0 0; background: var(--steel); border-radius: 4px; }
.bar .fl.hot { background: var(--red); } .bar .fl.mid { background: #D99A1E; }
.bar .cap { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink); opacity: .45; }
.bar .val { text-align: right; font-family: var(--mono); font-size: 12.5px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.pipe .stg { background: var(--surface-2); border: 1px solid var(--divider); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; cursor: pointer; text-align: left; }
.pipe .stg:hover { border-color: var(--head); }
.pipe .stg .l { font-size: 12.5px; color: var(--muted); }
.pipe .stg .v { font-size: 22px; font-weight: 700; color: var(--head); font-variant-numeric: tabular-nums; }
.pipe .stg .d { font-size: 12.5px; color: var(--faint); font-family: var(--mono); }
.pipe .stg.q { background: var(--surface); border-style: dashed; border-color: #CBD1D7; }

.thread { display: grid; gap: 0; }
.thread .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 8px 0; position: relative; }
.thread .row .ic { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--silver); background: var(--surface); margin-top: 3px; position: relative; z-index: 1; }
.thread .row:not(:last-child)::after { content: ""; position: absolute; left: 6px; top: 22px; bottom: -6px; width: 2px; background: var(--line); }
.thread .row.done .ic { border-color: var(--green); background: var(--green); }
.thread .row.cur .ic { border-color: #D99A1E; }
.thread .doc { font-family: var(--mono); font-size: 12px; color: var(--faint); }

.alerts { display: grid; gap: 0; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); align-items: center; }
.alert:last-child { border-bottom: 0; }
.alert p { margin: 0; }

.audit { display: grid; gap: 0; font-size: 13.5px; }
.audit .e { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--divider); }
.audit .e:last-child { border-bottom: 0; }
.audit .tm { color: var(--faint); font-family: var(--mono); font-size: 12px; }
.audit .mod { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--steel); margin-right: 6px; }
.audit .by { color: var(--faint); font-size: 12.5px; }

.tl { display: grid; gap: 12px; position: relative; }
.tl::before { content: ""; position: absolute; left: 91px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tl .ev { display: grid; grid-template-columns: 56px 36px minmax(0, 1fr); gap: 16px; align-items: start; position: relative; }
.tl .tm { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); padding-top: 10px; text-align: right; }
.tl .avatar { margin-top: 2px; position: relative; z-index: 1; font-size: 12px; }
.tl .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; min-width: 0; }
.tl .box .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tl .box .l1 b { color: var(--head); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--tint); color: var(--head); }
.tag.ok { background: var(--green-bg); color: var(--green); } .tag.warn { background: var(--amber-bg); color: var(--amber); } .tag.bad { background: var(--red-bg); color: var(--red); } .tag.ai { background: #EDE9F8; color: #4B3A8C; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chipf { border: 1px solid #CBD1D7; background: var(--surface); border-radius: 999px; padding: 7px 15px; font-weight: 600; font-size: 13.5px; color: var(--head); cursor: pointer; }
.chipf.on { background: var(--dark); color: #FFFFFF; border-color: var(--dark); }
.dayhd { display: flex; gap: 12px; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--head); }
.dayhd::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.dayhd span { order: 2; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--faint); }

.drawer { position: fixed; inset: 0 0 0 auto; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; box-shadow: -16px 0 40px rgba(3, 42, 59, .16); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .hd { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer .bd { padding: 8px 24px 24px; overflow-y: auto; }
.scrim { position: fixed; inset: 0; background: rgba(244, 245, 247, .7); z-index: 19; }

.doc-prev { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px 36px; display: grid; gap: 20px; }
.doc-prev .dh { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--head); padding-bottom: 16px; align-items: center; }
.doc-prev .logo { background: var(--nav-bg); border-radius: 8px; padding: 10px 14px; display: inline-block; }
.doc-prev .logo img { width: 84px; display: block; }
.doc-prev dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
.doc-prev dt { color: var(--faint); } .doc-prev dd { margin: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps .s { font-size: 13px; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--track); color: var(--muted); }
.steps .s.done { background: var(--green-bg); color: var(--green); }
.steps .s.cur { background: var(--dark); color: #FFFFFF; font-weight: 600; }
.steps .s.sub { outline: 1px dashed var(--silver); outline-offset: -1px; }

.check { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 0; border-bottom: 1px solid var(--divider); }
.check:last-child { border-bottom: 0; }
.check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--dark); }
.check label { cursor: pointer; }
.files { display: grid; gap: 8px; }
.file { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
.file .ext { font-size: 11px; font-weight: 700; background: var(--red-bg); color: var(--red); padding: 6px 7px; border-radius: 6px; text-transform: uppercase; }
.file .ext.xlsx { background: var(--green-bg); color: var(--green); } .file .ext.jpg { background: var(--tint); color: var(--head); }
.file .psub { margin-left: auto; }

.wo { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); cursor: pointer; text-align: left; }
.wo:hover { border-color: var(--head); }
.wo.sel { border-color: var(--head); box-shadow: 0 0 0 1px var(--head); }
.wo .top-l { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prog { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); }

.wh { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 24px; align-items: start; }
.phone { background: var(--phone); border-radius: 34px; padding: 12px; width: 100%; max-width: 360px; box-shadow: 0 18px 40px rgba(3, 42, 59, .2); }
.screen { background: var(--surface); border-radius: 24px; overflow: hidden; min-height: 600px; display: flex; flex-direction: column; }
.sbar { display: flex; justify-content: space-between; font-size: 11px; padding: 8px 18px 4px; color: var(--muted); }
.apphd { background: var(--nav-bg); color: #FFFFFF; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.apphd b { font-size: 15px; }
.modes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }

function bridge(start, steps, l0, l1) {
  var W = 460, H = 220, padL = 40, padB = 34, padT = 24, top = Math.ceil(start), end = start, lo;
  steps.forEach(function (s) { end += s[1]; });
  lo = Math.floor(end) - 1;
  var cols = steps.length + 2, cw = (W - padL - 10) / cols, bw = cw * 0.56;
  function y(v) { return padT + (top - v) / (top - lo) * (H - padT - padB); }
  var g = '', run = start, i, tk;
  for (tk = lo; tk <= top; tk++) g += '<line class="gl" x1="' + padL + '" x2="' + (W - 6) + '" y1="' + y(tk) + '" y2="' + y(tk) + '"/><text x="' + (padL - 6) + '" y="' + (y(tk) + 4) + '" text-anchor="end">' + tk + '%</text>';
  function col(ix, a, b, fill, lab, val) {
    var x = padL + ix * cw + (cw - bw) / 2, y1 = y(Math.max(a, b)), y2 = y(Math.min(a, b));
    return '<rect x="' + x + '" y="' + y1 + '" width="' + bw + '" height="' + Math.max(1, y2 - y1) + '" rx="2" fill="' + fill + '"/>' +
      '<text class="vt" x="' + (x + bw / 2) + '" y="' + (y1 - 6) + '" text-anchor="middle">' + val + '</text>' +
      '<text x="' + (x + bw / 2) + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + lab + '</text>';
  }
  var css = getComputedStyle(document.documentElement);
  var cA = css.getPropertyValue('--steel').trim() || '#5E8A9C', cR = css.getPropertyValue('--red').trim() || '#A4231A', cE = css.getPropertyValue('--head').trim() || '#032A3B';
  g += col(0, lo, start, cE, l0, start.toFixed(1) + '%');
  for (i = 0; i < steps.length; i++) { var nx = run + steps[i][1]; g += col(i + 1, run, nx, steps[i][1] < 0 ? cR : cA, steps[i][0].split(' ')[0], (steps[i][1] > 0 ? '+' : '') + steps[i][1].toFixed(1)); run = nx; }
  g += col(cols - 1, lo, run, cA, l1, run.toFixed(1) + '%');
  var leg = steps.map(function (s) { return esc(s[0]) + ' ' + (s[1] > 0 ? '+' : '') + s[1].toFixed(1) + ' pts'; }).join(' · ');
  return '<div class="bridge"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Margin bridge from ' + start.toFixed(1) + '% to ' + run.toFixed(1) + '%">' + g + '</svg></div><p class="note">' + leg + '. Axis starts at ' + lo + '%.</p>';
}

    fam.map(function (x) { return '<div class="bar"><span>' + x[0] + '</span><span style="display:grid;gap:3px"><span class="tr" style="height:7px"><span class="fl" style="width:' + (x[1] / 45 * 100) + '%;background:' + cA + '"></span></span><span class="tr" style="height:7px"><span class="fl" style="width:' + (x[2] / 45 * 100) + '%"></span></span></span><span class="val">' + x[2].toFixed(1) + '%</span></div>'; }).join('') +
    '</div><p class="note" style="margin-top:10px">Scale 0–45%. Value shown is actual.</p></div></div>';
  var mx = 800, ch = 120, bw = 12;
  var svg = '<svg viewBox="0 0 320 150" role="img" aria-label="Eight-week cash flow forecast">';
  [0, 400, 800].forEach(function (v) { var y = 10 + ch - v / mx * ch; svg += '<line class="gl" x1="30" x2="316" y1="' + y + '" y2="' + y + '"/><text x="26" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>'; });
  cash.forEach(function (c, k) { var x = 38 + k * 35; svg += '<rect x="' + x + '" y="' + (10 + ch - c[1] / mx * ch) + '" width="' + bw + '" height="' + (c[1] / mx * ch) + '" rx="1.5" fill="' + cA + '"/><rect x="' + (x + bw + 2) + '" y="' + (10 + ch - c[2] / mx * ch) + '" width="' + bw + '" height="' + (c[2] / mx * ch) + '" rx="1.5" fill="' + cSil + '"/><text x="' + (x + bw) + '" y="146" text-anchor="middle">' + c[0] + '</text>'; });
  svg += '</svg>';
  h += '<div class="card"><div class="hd"><h2>Cash flow forecast</h2><span class="sub">AED k, next 8 weeks</span></div><div class="bd"><div class="legend" style="margin-bottom:6px"><span><i style="background:' + cA + '"></i>Collections</span><span><i style="background:' + cSil + '"></i>Supplier payments</span></div><div class="bridge">' + svg + '</div></div></div></div>';
  h += '<div class="grid g2"><div class="card"><div class="hd"><h2>Company position</h2><span class="sub">Sample values</span></div><div class="tw"><table><tbody>' +
    [['Work in progress', 'AED 0.34M', '11 orders · 2 older than 45 days'], ['Open purchase commitments', 'AED 1.24M', '27 POs · AED 0.41M due in 14 days'], ['Supplier price variance (QTD)', '+AED 136k', 'Mainly Fusion profiles'], ['Receivables over 60 days', 'AED 0.58M', '4 clients'], ['COGS this month', 'AED 1.92M', 'On delivered orders']]
      .map(function (x) { return '<tr><td>' + x[0] + '</td><td class="r"><b>' + x[1] + '</b></td><td class="psub">' + x[2] + '</td></tr>'; }).join('') +
    '</tbody></table></div></div><div class="ai"><span class="tag">AI variance explanation · sample</span><p>ORX-0418 is forecast ' + (t.gm - fgm).toFixed(1) + ' points below its estimate. Labour is the largest driver: CNC overtime and glazing-bead rework on the casements. Material follows, from Supplier A\'s price rise after the quotation was approved.</p><p class="psub">Recommendation for review: re-quote Fusion profiles monthly until a price lock is agreed, and add a bead-fit check at assembly.</p><p class="note">AI explains variances. It does not post entries, adjust costs or close periods.</p></div></div>';
  return h;
}

/* ---------- Render & events ---------- */
var VIEWS = { overview: vOverview, estimation: vEstimation, oc: vOC, prf: vPRF, procurement: vProcurement, production: vProduction, warehouse: vWarehouse, activity: vActivity, finance: vFinance };
function render() {
  var app = document.getElementById('app'), si = document.getElementById('signin');
  if (S.view === 'signin') { app.hidden = true; si.hidden = false; si.innerHTML = vSignin(); document.getElementById('overlay').innerHTML = ''; return; }
  app.hidden = false; si.hidden = true; si.innerHTML = '';
  BAND = null;
  var html = VIEWS[S.view]();
  shell();
  document.getElementById('band').innerHTML = bandHtml();
  document.getElementById('view').innerHTML = html;
  document.getElementById('overlay').innerHTML = S.drawer ? '<div class="scrim" data-act="closeAudit"></div><aside class="drawer" role="dialog" aria-label="Audit trail"><div class="hd"><div><p class="mono faint" style="margin:0">ORX-0418</p><h2 style="font-size:22px">Audit trail</h2></div><button type="button" class="btn sm" style="margin-left:auto" data-act="closeAudit">Close</button></div><div class="bd">' + auditList() + '</div></aside>' : '';
}
function vSignin() {
  return '<div class="signin"><div class="l"><img src="' + LOGO_SRC + '" alt="Oryx Doors &amp; Windows"><div><h2>One order, one record, quotation to cash.</h2><p>Estimation, PRF, procurement, production, warehouse and finance in one place. Every step is recorded with who did it and when.</p></div><small>Oryx Operations ERP · Prototype</small></div>' +
    '<div class="r"><form id="signinForm"><div><h2>Sign in</h2><p class="muted" style="margin:4px 0 0">Use your Oryx work email.</p></div><label class="field" for="siEmail">Work email<input id="siEmail" type="email" placeholder="name@oryxdoors.com" autocomplete="off"></label><label class="field" for="siPw">Password<input id="siPw" type="password" autocomplete="off"></label><button type="submit" class="btn dk">Sign in</button>' +
    '<div class="help"><b>Prototype only</b><span>Any email and password opens the demo. No account is created.</span></div></form></div></div>';
}
var ACT_TAG = { 'Estimation': '', 'Sales': '', 'Projects': '', 'Procurement': 'warn', 'Production': 'ok', 'Warehouse': 'ok', 'Finance': '', 'Approval': 'warn', 'AI check': 'ai', 'Demo': '' };
function initials(w) { return w === 'System' ? 'SY' : w.split(/\s+/).map(function (x) { return x[0]; }).join('').slice(0, 2).toUpperCase(); }
function vActivity() {
  var f = S.actFilter || 'All', mods = ['All', 'Estimation', 'Projects', 'Procurement', 'Production', 'Warehouse', 'Finance', 'Approval'];
  var all = S.audit.slice().reverse().filter(function (e) { return f === 'All' || e[1] === f || (f === 'Approval' && e[1] === 'AI check'); });
  var list = S.actAll ? all : all.slice(0, 12);
  var c = function (m) { return S.audit.filter(function (e) { return e[1] === m; }).length; };
  ph('', 'Activity', 'Who did what, and when. Every approval, document, purchase, production step and stock movement on ORX-0418.', '<button type="button" class="btn" disabled>Export (.xlsx)</button>');
  var h = '<div class="kpis"><div class="kpi"><span class="l">Approvals</span><span class="v">' + (c('Approval') + S.audit.filter(function (e) { return /approved|released|issued/i.test(e[3]); }).length) + '</span></div>' +
    '<div class="kpi"><span class="l">Stock movements</span><span class="v">' + c('Warehouse') + '</span></div>' +
    '<div class="kpi"><span class="l">Production updates</span><span class="v">' + c('Production') + '</span></div>' +
    '<div class="kpi ' + (c('AI check') ? 'warn' : '') + '"><span class="l">AI flags reviewed</span><span class="v">' + c('AI check') + '</span></div></div>';
  h += '<div class="card"><div class="bd"><div class="filters">' + mods.map(function (m) { return '<button type="button" class="chipf' + (m === f ? ' on' : '') + '" data-flt="' + m + '">' + m + '</button>'; }).join('') + '</div></div></div>';
  var day = null;
  h += '<div class="stack">';
  list.forEach(function (e, i) {
    var p = e[0].split(' · ');
    if (p[0] !== day) { day = p[0]; var n = list.filter(function (x) { return x[0].indexOf(day) === 0; }).length; h += (i ? '</div>' : '') + '<div class="dayhd">' + (day === dstr(TODAY) ? 'Today · ' : '') + esc(day) + '<span>' + n + ' event' + (n > 1 ? 's' : '') + '</span></div><div class="tl">'; }
    h += '<div class="ev"><span class="tm">' + esc(p[1] || '') + '</span><span class="avatar' + (e[2] === 'System' ? ' dk' : '') + '">' + initials(e[2]) + '</span><div class="box"><div class="l1"><span class="tag ' + (ACT_TAG[e[1]] || '') + '">' + esc(e[1]) + '</span><b>' + esc(e[2]) + '</b></div><div style="margin-top:4px">' + esc(e[3]) + '</div></div></div>';
  });
  if (list.length) h += '</div>';
  if (all.length > list.length) h += '<div class="row-gap"><span class="note">Showing ' + list.length + ' of ' + all.length + ' events</span><button type="button" class="btn sm" data-act="actAll">Show older</button></div>';
  else h += '<div class="card"><div class="bd"><p class="note">No activity in this category yet. Work through the order flow to add some.</p></div></div>';
  return h + '</div>';
}
function go(v, keep) {
  if (!VIEWS[v] && v !== 'signin') return;
  S.view = v; render();
  if (!keep) window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}

var A = {
  approveQ: function () { if (flags().length) return; S.q.approved = true; log('Estimation', 'Estimation Manager', 'Q-2026-0418 Rev 2 approved at ' + aed(totals().sell) + ', margin ' + pct(totals().gm)); log('Sales', 'System', 'OC-2026-0418 generated from approved quotation'); toast('Quotation approved. OC-2026-0418 generated.'); go('oc'); },
  hinge: function () { S.q.hinge = true; log('Estimation', 'Estimator', 'Line 3: pivot hinge ACC-HDW-PV1 (300 kg) added to BOM'); toast('Hinge added to BOM.'); render(); },
  glass: function () { S.q.glassOk = true; log('AI check', 'Estimation Manager', 'Line 2 glass cost reviewed: spec and area confirmed'); render(); },
  raise: function (el) { var id = el.getAttribute('data-l'), l = LINES.filter(function (x) { return x.id === id; })[0], need = Math.ceil(MARGIN_APPROVAL / (100 - MARGIN_APPROVAL) * 100); S.mk[id] = Math.max(S.mk[id], need); S.selLine = id; log('Estimation', 'Estimator', 'Line ' + id.slice(1) + ' markup raised to ' + S.mk[id] + '%'); toast('Line ' + id.slice(1) + ' markup set to ' + S.mk[id] + '%.'); render(); },
  mApprove: function (el) { var id = el.getAttribute('data-l'), r = calc(LINES.filter(function (x) { return x.id === id; })[0]); S.q.marginOk[id] = r.mk; log('Approval', 'Commercial Director', 'Line ' + id.slice(1) + ' approved at ' + pct(r.gm) + ' gross margin (below ' + MARGIN_APPROVAL + '% threshold)'); toast('Margin exception approved.'); render(); },
  issueOC: function () { S.oc.issued = true; log('Sales', 'Sales Coordinator', 'OC-2026-0418 issued to client'); log('Projects', 'System', 'PRF-0418 Rev A drafted from OC-2026-0418'); toast('OC issued. PRF-0418 drafted.'); go('prf'); },
  releasePRF: function () { S.prf.released = true; log('Projects', 'Projects Manager', 'PRF-0418 Rev A released: 4 lines to production, 2 lines to procurement'); toast('PRF released to Procurement and Production.'); go('procurement'); },
  createPR: function () { S.proc.prs = true; var g = prGroups(); log('Procurement', 'System', g.length + ' purchase requisitions created from net shortages (' + g.map(function (x) { return x.pr; }).join(', ') + ')'); toast(g.length + ' purchase requisitions drafted.'); render(); },
  issuePO: function () { S.proc.pos = true; var g = prGroups(); log('Procurement', 'Procurement Officer', 'POs issued: ' + g.map(function (x) { return x.po; }).join(', ') + ' · ' + aed(g.reduce(function (a, x) { return a + x.val; }, 0))); toast('POs issued. Work orders can be released.'); render(); },
  woRel: function () { var s = S.wo[S.selWo]; if (!S.proc.pos) return; s.rel = true; log('Production', 'Production Supervisor', S.selWo + ' released to floor; materials reserved'); render(); },
  woStep: function () { var w = WO_DEF.filter(function (x) { return x.id === S.selWo; })[0], s = S.wo[w.id]; var hrs = w.std / w.steps.length * (s.step === 1 && w.ws === 'Fusion' ? 1.25 : 1.04); s.hrs += hrs; log('Production', 'Production Supervisor', w.id + ': ' + w.steps[s.step] + ' complete (' + q1(hrs) + ' h)'); s.step++; if (woDone(w.id)) { log('Production', 'QC Inspector', w.id + ' passed final QC; finished goods ready for put-away'); if (w.id === 'WO-0418-01') { S.hu['FG-0418-01'].st = 'Ready for dispatch'; S.hu['FG-0418-01'].loc = 'WH-D01-R01-L01'; } toast(w.id + ' complete.'); } render(); },
  woIssue: function () { var s = S.wo[S.selWo]; s.issued = true; log('Production', 'Storekeeper', 'Materials issued to ' + S.selWo + ' against approved BOM'); render(); },
  woScrap: function () { S.wo[S.selWo].scrap++; log('Production', 'Production Supervisor', S.selWo + ': 1 bar FUS-PRO-001 scrapped (miscut)'); render(); },
  audit: function () { S.drawer = true; render(); },
  closeAudit: function () { S.drawer = false; render(); },
  manItem: function () { var v = (document.getElementById('manItem').value || '').trim().toUpperCase(); scanItem(v); },
  whBack: function () { var W = S.wh; W.err = null; W.step = W.step === 'qty' ? 'loc' : 'item'; render(); },
  whNew: function () { var W = S.wh; W.step = 'item'; W.item = W.loc = null; W.qty = ''; W.err = null; render(); },
  whSubmit: function () {
    var W = S.wh, it = S.hu[W.item], q = parseFloat(document.getElementById('whQty').value), cond = document.getElementById('whCond').value;
    W.qty = isNaN(q) ? '' : q; W.cond = cond;
    if (isNaN(q) || q <= 0) { W.err = ['Enter a quantity', 'Quantity must be more than zero.']; render(); return; }
    if (q > it.qty + 1e-9) { W.err = ['Quantity too high', 'Only ' + q1(it.qty) + ' ' + it.u + ' on this label. Count again or split the bundle.']; render(); return; }
    var from = it.loc || (it.po ? 'Supplier' : '—'), id = 'MV-' + String(26000 + S.audit.length), modeTxt = MODES.filter(function (m) { return m[0] === W.mode; })[0][1];
    var label = W.mode === 'put' ? 'Received and put away' : W.mode === 'move' ? 'Transferred' : W.mode === 'pick' ? 'Issued to production' : 'Dispatched';
    (S.hist[W.item] = S.hist[W.item] || []).push([now(), label + (cond !== 'Good' ? ' (' + cond.toLowerCase() + ')' : ''), from, W.loc, q1(q) + ' ' + it.u, 'Storekeeper']);
    if (W.mode === 'put') { it.po = false; it.st = cond === 'Good' ? 'In stock' : cond; S.proc.received[it.code] = true; }
    if (W.mode === 'pick') { it.st = 'Issued to production'; }
    if (W.mode === 'dsp') { it.st = 'Dispatched'; log('Finance', 'System', 'INV-0418-01 progress invoice raised on dispatch DN-0418-01'); }
    if (W.mode === 'move' && cond !== 'Good') it.st = cond;
    it.loc = W.loc; if (W.mode === 'pick' || W.mode === 'dsp') it.qty = Math.max(0, it.qty - q);
    var txt = q1(q) + ' ' + it.u + ' of ' + W.item + ' · ' + from + ' → ' + W.loc;
    log('Warehouse', 'Storekeeper', modeTxt + ': ' + txt + ' (' + id + ')');
    W.last = { id: id, txt: txt, t: now() }; W.step = 'done'; W.err = null; W.sel = W.item; render();
  },
  ff: function () {
    S.q.hinge = true; S.q.glassOk = true; S.q.marginOk.L5 = S.mk.L5; S.q.approved = true; S.oc.issued = true;
    CHECKS.forEach(function (c) { S.prf.checks[c[0]] = true; }); S.prf.released = true; S.proc.prs = true; S.proc.pos = true;
    var it = S.hu['FUS-PRO-001-B0412']; it.po = false; it.st = 'In stock'; it.loc = 'WH-A03-R02-L04'; S.proc.received['FUS-PRO-001'] = true;
    (S.hist['FUS-PRO-001-B0412'] = []).push([dstr(TODAY) + ' · 08:30', 'Received and put away', 'Supplier', 'WH-A03-R02-L04', '46 bars', 'Storekeeper']);
    WO_DEF.forEach(function (w, i) { var s = S.wo[w.id]; s.rel = true; s.issued = i < 2; s.step = i === 0 ? w.steps.length - 1 : i === 1 ? 2 : 0; s.hrs = w.std / w.steps.length * s.step * 1.08; });
    log('Demo', 'System', 'Fast-forwarded: quotation approved, OC issued, PRF released, POs issued, work orders released');
    S.selWo = 'WO-0418-01'; toast('Fast-forwarded. Complete WO-0418-01 packing, then dispatch FG-0418-01.'); go('production');
  },
  reset: function () { fresh(); toast('Demo reset.'); go('overview'); },
  actAll: function () { S.actAll = true; render(); },
  signout: function () { S.drawer = false; go('signin'); }
};
function scanItem(code) {
  var W = S.wh;
  if (!S.hu[code]) { W.err = ['Label not recognised', (code || 'Blank code') + ' is not a known item, bundle or pallet label.']; render(); return; }
  W.item = code; W.step = 'loc'; W.err = null; W.sel = code; W.qty = ''; render();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go],[data-act],[data-line],[data-wo],[data-scan],[data-loc],[data-mode],[data-flt]');
  if (!t) return;
  if (t.hasAttribute('data-flt')) { S.actFilter = t.getAttribute('data-flt'); render(); return; }
  if (t.hasAttribute('data-act')) { var f = A[t.getAttribute('data-act')]; if (f && !t.disabled) f(t); return; }
  if (t.hasAttribute('data-go')) { S.drawer = false; go(t.getAttribute('data-go')); return; }
  if (t.hasAttribute('data-line')) { if (e.target.closest('input')) return; S.selLine = t.getAttribute('data-line'); render(); return; }
  if (t.hasAttribute('data-wo')) { S.selWo = t.getAttribute('data-wo'); render(); return; }
  if (t.hasAttribute('data-scan')) { scanItem(t.getAttribute('data-scan')); return; }
  if (t.hasAttribute('data-loc')) { S.wh.loc = t.getAttribute('data-loc'); S.wh.err = whValidate(); if (!S.wh.err) S.wh.step = 'qty'; render(); return; }
  if (t.hasAttribute('data-mode')) { var W = S.wh; W.mode = t.getAttribute('data-mode'); W.step = 'item'; W.item = W.loc = null; W.err = null; render(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-mk')) { var v = parseFloat(t.value); if (!isNaN(v) && v >= 0) { var id = t.getAttribute('data-mk'); S.mk[id] = Math.min(200, Math.round(v)); S.selLine = id; } render(); var el = document.getElementById(t.id); if (el) el.focus(); }
  else if (t.hasAttribute('data-ck')) { S.prf.checks[t.getAttribute('data-ck')] = t.checked; if (t.checked) log('Projects', 'Projects Manager', 'PRF-0418 check complete: ' + CHECKS.filter(function (c) { return c[0] === t.getAttribute('data-ck'); })[0][1]); render(); }
  else if (t.id === 'histSel') { S.wh.sel = t.value; render(); }
});
document.addEventListener('submit', function (e) { if (e.target.id === 'signinForm') { e.preventDefault(); go('overview'); } });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.drawer) { S.drawer = false; render(); }
  if (e.key === 'Enter' && e.target.id === 'manItem') A.manItem();
});

fresh();
var h0 = (location.hash || '').slice(1);
S.view = (VIEWS[h0] || h0 === 'signin') ? h0 : 'overview';
render();
})();
</script>
