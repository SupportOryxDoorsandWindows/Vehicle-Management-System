<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Oryx Operations ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed Oryx Blue sidebar + work area; one order (ORX-0418) threads through every module via a journey rail. */
:root {
  --bg: #F4F4F1; --surface: #FFFFFF; --surface-2: #F7F7F4; --ink: #15191C; --muted: #56626B; --faint: #6B7680;
  --line: #E2E2DC; --divider: #F0F0EB; --accent: #022A3A; --accent-ink: #022A3A; --accent-hover: #0B4F6A; --tint: #E6EEF1;
  --silver: #A9A9A9; --steel: #5E8A9C; --track: #EEEEE9;
  --btn-bg: #022A3A; --btn-fg: #FFFFFF; --btn-hover: #0B4F6A;
  --nav-bg: #022A3A; --nav-active: #0E4258; --nav-line: #1A4B60; --nav-text: #C9D6DC; --nav-muted: #8FA6B0;
  --red: #A4231A; --red-bg: #FBE4E1; --amber: #8A4B00; --amber-bg: #FCEFD9; --green: #1C6340; --green-bg: #E1F1E7;
  --phone: #0D1A20; --scan: #0F2630;
  --sans: "IBM Plex Sans", system-ui, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1418; --surface: #111D23; --surface-2: #16242B; --ink: #E5EBED; --muted: #A2B0B7; --faint: #8395A0;
  --line: #22343C; --divider: #1A2A31; --accent: #8CC3D6; --accent-ink: #A9D4E3; --accent-hover: #B5DCE9; --tint: #15303B;
  --silver: #6E7A80; --steel: #7FAFC1; --track: #1C2C33;
  --btn-bg: #1C5D77; --btn-fg: #FFFFFF; --btn-hover: #24708F;
  --nav-bg: #061D27; --nav-active: #0E3A4D; --nav-line: #15394A; --nav-text: #C9D6DC; --nav-muted: #7F98A3;
  --red: #F0938A; --red-bg: #3A1C1A; --amber: #EBB56A; --amber-bg: #392A13; --green: #82CFA3; --green-bg: #13301F;
  --phone: #050C10; --scan: #0B1E26; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1418; --surface: #111D23; --surface-2: #16242B; --ink: #E5EBED; --muted: #A2B0B7; --faint: #8395A0;
  --line: #22343C; --divider: #1A2A31; --accent: #8CC3D6; --accent-ink: #A9D4E3; --accent-hover: #B5DCE9; --tint: #15303B;
  --silver: #6E7A80; --steel: #7FAFC1; --track: #1C2C33;
  --btn-bg: #1C5D77; --btn-fg: #FFFFFF; --btn-hover: #24708F;
  --nav-bg: #061D27; --nav-active: #0E3A4D; --nav-line: #15394A; --nav-text: #C9D6DC; --nav-muted: #7F98A3;
  --red: #F0938A; --red-bg: #3A1C1A; --amber: #EBB56A; --amber-bg: #392A13; --green: #82CFA3; --green-bg: #13301F;
  --phone: #050C10; --scan: #0B1E26; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nav-bg); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
.num, td.r, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
td.mono { white-space: nowrap; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--nav-bg); color: var(--nav-text); display: flex; flex-direction: column; position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); padding-left: env(safe-area-inset-left, 0px); }
.brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--nav-line); }
.brand b { display: block; color: #FFFFFF; font-size: 18px; letter-spacing: .28em; font-weight: 600; }
.brand span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--nav-muted); }
.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav .grp { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-muted); padding: 14px 10px 6px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--nav-text); padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.nav button:hover { background: var(--nav-active); color: #FFFFFF; }
.nav button.on { background: var(--nav-active); color: #FFFFFF; box-shadow: inset 2px 0 0 var(--silver); }
.nav .n { font-family: var(--mono); font-size: 11px; color: var(--nav-muted); width: 16px; }
.nav .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--nav-line); }
.nav .dot.done { background: #7CC79E; } .nav .dot.cur { background: #E8B062; }
.side-foot { padding: 14px 16px 18px; border-top: 1px solid var(--nav-line); display: grid; gap: 8px; font-size: 12px; }
.side-foot button { background: transparent; border: 1px solid var(--nav-line); color: var(--nav-text); border-radius: 6px; padding: 7px 10px; cursor: pointer; text-align: left; }
.side-foot button:hover { background: var(--nav-active); color: #FFFFFF; }
.side-foot small { color: var(--nav-muted); line-height: 1.35; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.orderchip { display: inline-flex; align-items: center; gap: 8px; background: var(--tint); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 12.5px; }
.orderchip b { background: var(--btn-bg); color: var(--btn-fg); border-radius: 999px; padding: 2px 9px; font-family: var(--mono); font-weight: 500; font-size: 12px; }
.sample { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--amber); background: var(--amber-bg); padding: 3px 8px; border-radius: 4px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.who { font-size: 12px; color: var(--muted); }
.rail { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail button { flex: 1 0 auto; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 14px 4px 0; cursor: pointer; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.rail button + button::before { content: ""; width: 18px; height: 1px; background: var(--line); margin-right: 6px; }
.rail .st { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--silver); display: grid; place-items: center; font-size: 10px; font-family: var(--mono); flex: none; }
.rail .done { color: var(--ink); } .rail .done .st { background: var(--green); border-color: var(--green); color: var(--surface); }
.rail .cur { color: var(--ink); font-weight: 600; } .rail .cur .st { border-color: var(--amber); background: var(--amber-bg); color: var(--amber); }
.rail .here { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--steel); }

.view { padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }
.ph { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.ph .t { min-width: 0; flex: 1 1 420px; }
.eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0 0 6px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; color: var(--accent-ink); }
h2 { font-size: 15px; margin: 0; font-weight: 600; }
h3 { font-size: 13px; margin: 0; font-weight: 600; }
.lede { color: var(--muted); margin: 0; max-width: 72ch; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--steel); }
.btn.pri { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.pri:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--accent-ink); padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--divider); flex-wrap: wrap; }
.card > .hd .sub { color: var(--faint); font-size: 12px; }
.card > .hd .r { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card > .bd { padding: 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.kpi .l { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.warn { box-shadow: inset 0 3px 0 var(--amber); } .kpi.bad { box-shadow: inset 0 3px 0 var(--red); } .kpi.good { box-shadow: inset 0 3px 0 var(--green); }

.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; white-space: nowrap; }
tr.sel td { background: var(--tint); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); } tr.click.sel:hover td { background: var(--tint); }
tfoot td { font-weight: 600; border-top: 1px solid var(--line); background: var(--surface-2); }
.pname { font-weight: 500; }
.psub { color: var(--faint); font-size: 12px; }
input.mk { width: 64px; text-align: right; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--surface); font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--track); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--green-bg); color: var(--green); }
.pill.warn { background: var(--amber-bg); color: var(--amber); }
.pill.bad { background: var(--red-bg); color: var(--red); }
.pill.info { background: var(--tint); color: var(--accent-ink); }

.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 8px; background: var(--tint); color: var(--ink); flex-wrap: wrap; }
.banner.warn { background: var(--amber-bg); } .banner.ok { background: var(--green-bg); }
.banner p { margin: 0; flex: 1 1 300px; min-width: 0; }
.ai { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 14px 16px; display: grid; gap: 8px; }
.ai .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--steel); }
.ai p { margin: 0; }

.flags { display: grid; gap: 10px; }
.flag { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.flag::before { content: ""; align-self: stretch; border-radius: 8px 0 0 8px; background: var(--amber); }
.flag.bad::before { background: var(--red); } .flag.ok::before { background: var(--green); }
.flag p { margin: 0; } .flag .psub { margin-top: 2px; }
.flag .fa { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.flag select { border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; background: var(--surface); font-size: 12px; max-width: 220px; }

.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 130px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .tr { height: 10px; background: var(--track); border-radius: 3px; position: relative; overflow: hidden; }
.bar .fl { position: absolute; inset: 0 auto 0 0; background: var(--steel); border-radius: 3px; }
.bar .fl.hot { background: var(--red); } .bar .fl.mid { background: var(--amber); }
.bar .cap { position: absolute; top: -3px; bottom: -3px; width: 1.5px; background: var(--ink); opacity: .5; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pipe .stg { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; border-top: 3px solid var(--steel); cursor: pointer; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.pipe .stg:hover { background: var(--tint); }
.pipe .stg .l { font-size: 11px; color: var(--faint); letter-spacing: .05em; text-transform: uppercase; }
.pipe .stg .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pipe .stg .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pipe .stg.q { border-top-color: var(--silver); }

.thread { display: grid; gap: 0; }
.thread .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 0; position: relative; }
.thread .row .ic { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--silver); background: var(--surface); margin-top: 3px; position: relative; z-index: 1; }
.thread .row:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: 20px; bottom: -6px; width: 2px; background: var(--line); }
.thread .row.done .ic { background: var(--green); border-color: var(--green); }
.thread .row.cur .ic { background: var(--amber-bg); border-color: var(--amber); }
.thread .doc { font-family: var(--mono); font-size: 12px; color: var(--faint); }

.alerts { display: grid; gap: 0; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--divider); align-items: start; }
.alert:last-child { border-bottom: 0; }
.alert p { margin: 0; }

.audit { display: grid; gap: 0; font-size: 12.5px; }
.audit .e { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); }
.audit .e:last-child { border-bottom: 0; }
.audit .tm { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
.audit .mod { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--steel); margin-right: 6px; }
.audit .by { color: var(--faint); }

.drawer { position: fixed; inset: 0 0 0 auto; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; box-shadow: -12px 0 32px rgba(2, 42, 58, .14); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer .hd { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer .bd { padding: 8px 20px 20px; overflow-y: auto; }
.scrim { position: fixed; inset: 0; background: rgba(2, 20, 28, .35); z-index: 19; }

.doc-prev { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 32px; display: grid; gap: 18px; }
.doc-prev .dh { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 2px solid var(--accent); padding-bottom: 14px; }
.doc-prev .logo { font-weight: 600; letter-spacing: .3em; font-size: 20px; color: var(--accent-ink); }
.doc-prev dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 12.5px; }
.doc-prev dt { color: var(--faint); } .doc-prev dd { margin: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps .s { font-size: 12px; padding: 4px 10px; border-radius: 5px; background: var(--track); color: var(--muted); }
.steps .s.done { background: var(--green-bg); color: var(--green); }
.steps .s.cur { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
.steps .s.sub { border: 1px dashed var(--silver); }

.check { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--divider); }
.check:last-child { border-bottom: 0; }
.check input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--btn-bg); }
.check label { cursor: pointer; }
.files { display: grid; gap: 8px; }
.file { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; }
.file .ext { font-family: var(--mono); font-size: 10px; background: var(--tint); color: var(--accent-ink); padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.file .psub { margin-left: auto; }

.wo { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); cursor: pointer; text-align: left; }
.wo:hover { border-color: var(--steel); }
.wo.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wo .top-l { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prog { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--green); }

/* QR warehouse phone */
.wh { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
.phone { background: var(--phone); border-radius: 34px; padding: 12px; width: 100%; max-width: 360px; box-shadow: 0 18px 40px rgba(2, 42, 58, .22); }
.screen { background: var(--surface); border-radius: 24px; overflow: hidden; min-height: 600px; display: flex; flex-direction: column; }
.sbar { display: flex; justify-content: space-between; font-size: 11px; padding: 8px 18px 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.apphd { background: var(--nav-bg); color: #FFFFFF; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.apphd b { font-size: 14px; }
.modes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.modes button { flex: none; background: transparent; border: 1px solid var(--nav-line); color: var(--nav-text); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; }
.modes button.on { background: #FFFFFF; color: #022A3A; border-color: #FFFFFF; }
.pbody { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.pstep { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.pstep i { flex: 1; height: 3px; border-radius: 2px; background: var(--track); }
.pstep i.on { background: var(--steel); }
.viewfinder { background: var(--scan); border-radius: 14px; aspect-ratio: 4 / 3; max-width: 100%; position: relative; display: grid; place-items: center; overflow: hidden; }
.viewfinder .corners { position: absolute; inset: 18%; border: 2px solid rgba(255, 255, 255, .0); }

  for (i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  function rnd() { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; }
  function finder(ox, oy) { for (y = 0; y < 7; y++) for (x = 0; x < 7; x++) { var e = x === 0 || y === 0 || x === 6 || y === 6 || (x > 1 && x < 5 && y > 1 && y < 5); cells[(oy + y) * N + ox + x] = e ? 1 : 2; } }
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
  for (y = 0; y < N; y++) for (x = 0; x < N; x++) { var k = y * N + x; if (cells[k] === undefined) { var nearF = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9); cells[k] = nearF ? 2 : (rnd() > 0.52 ? 1 : 2); } }
  var p = '';
  for (y = 0; y < N; y++) for (x = 0; x < N; x++) if (cells[y * N + x] === 1) p += 'M' + (x + 2) + ' ' + (y + 2) + 'h1v1h-1z';
  return '<svg viewBox="0 0 25 25" aria-hidden="true" shape-rendering="crispEdges"><rect width="25" height="25" fill="#FFFFFF"/><path d="' + p + '" fill="#022A3A"/></svg>';
}

function bridge(start, steps, l0, l1) {
  var W = 460, H = 220, padL = 40, padB = 34, padT = 24, top = Math.ceil(start), end = start, lo;
  steps.forEach(function (s) { end += s[1]; });
  lo = Math.floor(end) - 1;
  var cols = steps.length + 2, cw = (W - padL - 10) / cols, bw = cw * 0.56;
  function y(v) { return padT + (top - v) / (top - lo) * (H - padT - padB); }
  var g = '', run = start, i, tk;
  for (tk = lo; tk <= top; tk++) g += '<line class="gl" x1="' + padL + '" x2="' + (W - 6) + '" y1="' + y(tk) + '" y2="' + y(tk) + '"/><text x="' + (padL - 6) + '" y="' + (y(tk) + 4) + '" text-anchor="end">' + tk + '%</text>';
  function col(ix, a, b, fill, lab, val) {
    var x = padL + ix * cw + (cw - bw) / 2, y1 = y(Math.max(a, b)), y2 = y(Math.min(a, b));
    return '<rect x="' + x + '" y="' + y1 + '" width="' + bw + '" height="' + Math.max(1, y2 - y1) + '" rx="2" fill="' + fill + '"/>' +
      '<text class="vt" x="' + (x + bw / 2) + '" y="' + (y1 - 6) + '" text-anchor="middle">' + val + '</text>' +
      '<text x="' + (x + bw / 2) + '" y="' + (H - padB + 16) + '" text-anchor="middle">' + lab + '</text>';
  }
  var css = getComputedStyle(document.documentElement);
  var cA = css.getPropertyValue('--steel').trim() || '#5E8A9C', cR = css.getPropertyValue('--red').trim() || '#A4231A', cE = css.getPropertyValue('--accent').trim() || '#022A3A';
  g += col(0, lo, start, cE, l0, start.toFixed(1) + '%');
  for (i = 0; i < steps.length; i++) { var nx = run + steps[i][1]; g += col(i + 1, run, nx, steps[i][1] < 0 ? cR : cA, steps[i][0].split(' ')[0], (steps[i][1] > 0 ? '+' : '') + steps[i][1].toFixed(1)); run = nx; }
  g += col(cols - 1, lo, run, cA, l1, run.toFixed(1) + '%');
  var leg = steps.map(function (s) { return esc(s[0]) + ' ' + (s[1] > 0 ? '+' : '') + s[1].toFixed(1) + ' pts'; }).join(' · ');
  return '<div class="bridge"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Margin bridge from ' + start.toFixed(1) + '% to ' + run.toFixed(1) + '%">' + g + '</svg></div><p class="note">' + leg + '. Axis starts at ' + lo + '%.</p>';
}

    [['Receive PO stock', 'Receive & put away → FUS-PRO-001-B0412 → WH-A03-R02-L04. Updates the PO in Procurement.'],

     ['Unknown location', 'Scan WH-A09-R99-L09. It does not exist in the location master.'],
     ['Pick to production', 'Pick FUS-PRO-014-B0388 to PRD-LINE-A. Stock is issued to ORX-0418.'],
     ['Dispatch finished goods', 'Dispatch FG-0418-01 to DSP-BAY-02. Blocked until WO-0418-01 is complete.']]
    .map(function (x) { return '<div class="alert">' + pill('info', x[0]) + '<p class="psub">' + esc(x[1]) + '</p><span></span></div>'; }).join('') + '</div></div></div>';
  right += '<p class="note">QR marks are illustrative and not scannable. In production, labels would be generated from the existing Oryx inventory system once its integration is confirmed.</p></div>';
  return h + '<div class="wh">' + p + right + '</div>';
}

function whValidate() {
  var W = S.wh, it = S.hu[W.item], loc = LOCS[W.loc];
  if (!loc) return ['Location not found', W.loc + ' is not in the location master. Check the label or ask the stock controller.'];
  if (W.mode === 'put') {
    if (!it.po && it.cat !== 'fg') return ['Nothing to receive', W.item + ' is already in stock at ' + it.loc + '. Use Transfer to move it.'];
    if (it.cat === 'fg') return ['Use Dispatch', 'Finished goods are booked out from Dispatch, not received.'];
    if (!S.proc.pos) return ['No open PO', 'There is no issued PO for ' + it.code + ' on ORX-0418. Issue the PO in Procurement first.'];
    if (loc.type !== 'WH') return ['Not a storage location', 'Put-away must go to a WH- location.'];
  }
  if (W.mode === 'move' && (it.po || loc.type !== 'WH')) return it.po ? ['Not received yet', W.item + ' is still on a PO. Receive it first.'] : ['Not a storage location', 'Transfers go between WH- locations.'];
  if (W.mode === 'pick') {
    if (loc.type !== 'PRD') return ['Wrong destination', 'Pick to production must go to a PRD- issue point.'];
    if (it.po) return ['Not received yet', W.item + ' is still on a PO. Receive it first.'];
    if (!S.prf.released) return ['No released work order', 'ORX-0418 has no released work order to issue against yet.'];
  }
  if (W.mode === 'dsp') {
    if (loc.type !== 'DSP') return ['Wrong destination', 'Dispatch must go to a DSP- bay.'];
    if (it.cat !== 'fg') return ['Not a finished good', 'Only finished goods or bought-in kits can be dispatched.'];
    if (!woDone(it.wo)) return ['Work order not complete', it.wo + ' is still in production. Complete it before dispatch.'];
  }
  if (loc.accepts.indexOf(it.cat) < 0) return ['Location does not accept this item', W.loc + ' is ' + loc.d.split(' · ')[0].toLowerCase() + '. Choose a matching location.'];
  return null;
}

/* ---------- Finance ---------- */
function vFinance() {
  var t = totals(), est = {}, fc = 0, i;
  CATS.forEach(function (c) { est[c[0]] = LINES.reduce(function (a, l) { return a + l.c[c[0]] * l.qty; }, 0); fc += FORECAST[c[0]]; });

  var committed = S.proc.pos ? prGroups().reduce(function (a, g) { return a + g.val; }, 0) : 0;

    '<div class="kpi"><span class="l">Estimated margin</span><span class="v">' + pct(t.gm) + '</span><span class="d">' + aed(t.sell - t.cost) + ' gross profit</span></div>' +
    '<div class="kpi warn"><span class="l">Forecast margin</span><span class="v">' + pct(fgm) + '</span><span class="d">' + (fgm - t.gm).toFixed(1) + ' pts vs estimate</span></div>' +
    '<div class="kpi"><span class="l">Cost to complete</span><span class="v">' + aed(Math.max(0, fc - actual)) + '</span><span class="d">Forecast less actual to date</span></div></div>';
  h += '<div class="grid g-main"><div class="card"><div class="hd"><h2>ORX-0418 estimated vs forecast cost</h2><span class="sub">Forecast figures are sample values</span></div><div class="tw"><table><thead><tr><th>Cost element</th><th class="r">Estimated</th><th class="r">Forecast</th><th class="r">Variance</th><th>Explanation</th></tr></thead><tbody>' +
    CATS.map(function (c) { var v = FORECAST[c[0]] - est[c[0]]; return '<tr><td>' + c[1] + '</td><td class="r">' + n0(est[c[0]]) + '</td><td class="r">' + n0(FORECAST[c[0]]) + '</td><td class="r">' + (v ? pill(v > 0 ? 'warn' : 'ok', (v > 0 ? '+' : '') + n0(v)) : '—') + '</td><td class="psub">' + esc(FC_WHY[c[0]]) + '</td></tr>'; }).join('') +
    '</tbody><tfoot><tr><td>Total (AED)</td><td class="r">' + n0(t.cost) + '</td><td class="r">' + n0(fc) + '</td><td class="r">+' + n0(fc - t.cost) + '</td><td></td></tr></tfoot></table></div></div>';
  var steps = CATS.filter(function (c) { return FORECAST[c[0]] !== est[c[0]]; }).map(function (c) { return [c[1], -(FORECAST[c[0]] - est[c[0]]) / t.sell * 100]; });
  h += '<div class="card"><div class="hd"><h2>Margin bridge, ORX-0418</h2></div><div class="bd">' + bridge(t.gm, steps, 'Estimated', 'Forecast') + '</div></div></div>';
  h += '<div class="card"><div class="hd"><h2>Live from this demo</h2><span class="sub">These figures move as you work through Procurement, Production and the warehouse</span></div><div class="bd"><div class="kpis">' +
    '<div class="kpi"><span class="l">Purchase commitments</span><span class="v">' + aed(committed) + '</span><span class="d">' + (S.proc.pos ? prGroups().length + ' open POs' : 'No POs issued yet') + '</span></div>' +
    '<div class="kpi"><span class="l">Material issued to WIP</span><span class="v">' + aed(issued) + '</span><span class="d">At estimated cost</span></div>' +
    '<div class="kpi"><span class="l">Labour booked</span><span class="v">' + aed(hrs * LABOUR_RATE) + '</span><span class="d">' + q1(hrs) + ' h at AED ' + LABOUR_RATE + '/h (sample rate)</span></div>' +
    '<div class="kpi ' + (scrap ? 'warn' : '') + '"><span class="l">Scrap cost</span><span class="v">' + aed(scrap * ITEMS['FUS-PRO-001'].price) + '</span><span class="d">' + scrap + ' bars logged</span></div>' +
    '<div class="kpi ' + (dispatched() ? 'good' : '') + '"><span class="l">Invoicing</span><span class="v">' + (dispatched() ? 'INV-0418-01' : 'Not yet') + '</span><span class="d">' + (dispatched() ? 'Raised on dispatch of FG-0418-01' : 'Triggered by first dispatch') + '</span></div>' +
    '</div></div></div>';

  var inv = [['Profiles', 0.86], ['Glass', 0.31], ['Accessories & hardware', 0.38], ['Work in progress', 0.34], ['Finished goods', 0.21]];
  var fam = [['Fusion', 39.5, 36.8], ['Freedom', 41.2, 37.0], ['Renson', 28.4, 27.1], ['Other shading', 33.0, 31.5]];
  var cash = [['W43', 420, 510], ['W44', 610, 380], ['W45', 290, 460], ['W46', 540, 350], ['W47', 380, 420], ['W48', 720, 400], ['W49', 330, 470], ['W50', 590, 360]];
  var css = getComputedStyle(document.documentElement), cS = css.getPropertyValue('--steel').trim(), cA = css.getPropertyValue('--accent').trim(), cSil = css.getPropertyValue('--silver').trim();
  h += '<div class="grid g3"><div class="card"><div class="hd"><h2>Inventory valuation</h2><span class="sub">AED 2.10M, weighted average</span></div><div class="bd"><div class="bars">' +
    inv.map(function (x) { return '<div class="bar"><span>' + x[0] + '</span><span class="tr"><span class="fl" style="width:' + (x[1] / 0.9 * 100) + '%"></span></span><span class="val">' + x[1].toFixed(2) + 'M</span></div>'; }).join('') +
    '</div><p class="note" style="margin-top:10px">Aged over 180 days: AED 146k.</p></div></div>';
  h += '<div class="card"><div class="hd"><h2>Margin by product family</h2></div><div class="bd"><div class="legend" style="margin-bottom:10px"><span><i style="background:' + cA + '"></i>Estimated</span><span><i style="background:' + cS + '"></i>Actual</span></div><div class="bars">' +
    fam.map(function (x) { return '<div class="bar"><span>' + x[0] + '</span><span style="display:grid;gap:3px"><span class="tr" style="height:7px"><span class="fl" style="width:' + (x[1] / 45 * 100) + '%;background:' + cA + '"></span></span><span class="tr" style="height:7px"><span class="fl" style="width:' + (x[2] / 45 * 100) + '%"></span></span></span><span class="val">' + x[2].toFixed(1) + '%</span></div>'; }).join('') +
    '</div><p class="note" style="margin-top:10px">Scale 0–45%. Value shown is actual.</p></div></div>';
  var mx = 800, ch = 120, bw = 12;
  var svg = '<svg viewBox="0 0 320 150" role="img" aria-label="Eight-week cash flow forecast">';
  [0, 400, 800].forEach(function (v) { var y = 10 + ch - v / mx * ch; svg += '<line class="gl" x1="30" x2="316" y1="' + y + '" y2="' + y + '"/><text x="26" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>'; });
  cash.forEach(function (c, k) { var x = 38 + k * 35; svg += '<rect x="' + x + '" y="' + (10 + ch - c[1] / mx * ch) + '" width="' + bw + '" height="' + (c[1] / mx * ch) + '" rx="1.5" fill="' + cA + '"/><rect x="' + (x + bw + 2) + '" y="' + (10 + ch - c[2] / mx * ch) + '" width="' + bw + '" height="' + (c[2] / mx * ch) + '" rx="1.5" fill="' + cSil + '"/><text x="' + (x + bw) + '" y="146" text-anchor="middle">' + c[0] + '</text>'; });
  svg += '</svg>';
  h += '<div class="card"><div class="hd"><h2>Cash flow forecast</h2><span class="sub">AED k, next 8 weeks</span></div><div class="bd"><div class="legend" style="margin-bottom:6px"><span><i style="background:' + cA + '"></i>Collections</span><span><i style="background:' + cSil + '"></i>Supplier payments</span></div><div class="bridge">' + svg + '</div></div></div></div>';
  h += '<div class="grid g2"><div class="card"><div class="hd"><h2>Company position</h2><span class="sub">Sample values</span></div><div class="tw"><table><tbody>' +
    [['Work in progress', 'AED 0.34M', '11 orders · 2 older than 45 days'], ['Open purchase commitments', 'AED 1.24M', '27 POs · AED 0.41M due in 14 days'], ['Supplier price variance (QTD)', '+AED 136k', 'Mainly Fusion profiles'], ['Receivables over 60 days', 'AED 0.58M', '4 clients'], ['COGS this month', 'AED 1.92M', 'On delivered orders']]
      .map(function (x) { return '<tr><td>' + x[0] + '</td><td class="r"><b>' + x[1] + '</b></td><td class="psub">' + x[2] + '</td></tr>'; }).join('') +
    '</tbody></table></div></div><div class="ai"><span class="tag">AI variance explanation · sample</span><p>ORX-0418 is forecast ' + (t.gm - fgm).toFixed(1) + ' points below its estimate. Labour is the largest driver: CNC overtime and glazing-bead rework on the casements. Material follows, from Supplier A\'s price rise after the quotation was approved.</p><p class="psub">Recommendation for review: re-quote Fusion profiles monthly until a price lock is agreed, and add a bead-fit check at assembly.</p><p class="note">AI explains variances. It does not post entries, adjust costs or close periods.</p></div></div>';
  return h;
}

/* ---------- Render & events ---------- */
var VIEWS = { overview: vOverview, estimation: vEstimation, oc: vOC, prf: vPRF, procurement: vProcurement, production: vProduction, warehouse: vWarehouse, finance: vFinance };
function render() {
  shell();
  document.getElementById('view').innerHTML = VIEWS[S.view]();
  document.getElementById('overlay').innerHTML = S.drawer ? '<div class="scrim" data-act="closeAudit"></div><aside class="drawer" role="dialog" aria-label="Audit trail"><div class="hd"><h2>Audit trail · ORX-0418</h2><span class="sub faint">' + S.audit.length + ' entries</span><button type="button" class="btn sm" style="margin-left:auto" data-act="closeAudit">Close</button></div><div class="bd">' + auditList() + '</div></aside>' : '';
}
function go(v, keep) {
  if (!VIEWS[v]) return;
  S.view = v; render();
  if (!keep) window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}

var A = {
  approveQ: function () { if (flags().length) return; S.q.approved = true; log('Estimation', 'Estimation Manager', 'Q-2026-0418 Rev 2 approved at ' + aed(totals().sell) + ', margin ' + pct(totals().gm)); log('Sales', 'System', 'OC-2026-0418 generated from approved quotation'); toast('Quotation approved. OC-2026-0418 generated.'); go('oc'); },
  hinge: function () { S.q.hinge = true; log('Estimation', 'Estimator', 'Line 3: pivot hinge ACC-HDW-PV1 (300 kg) added to BOM'); toast('Hinge added to BOM.'); render(); },
  glass: function () { S.q.glassOk = true; log('AI check', 'Estimation Manager', 'Line 2 glass cost reviewed: spec and area confirmed'); render(); },
  raise: function (el) { var id = el.getAttribute('data-l'), l = LINES.filter(function (x) { return x.id === id; })[0], need = Math.ceil(MARGIN_APPROVAL / (100 - MARGIN_APPROVAL) * 100); S.mk[id] = Math.max(S.mk[id], need); S.selLine = id; log('Estimation', 'Estimator', 'Line ' + id.slice(1) + ' markup raised to ' + S.mk[id] + '%'); toast('Line ' + id.slice(1) + ' markup set to ' + S.mk[id] + '%.'); render(); },
  mApprove: function (el) { var id = el.getAttribute('data-l'), r = calc(LINES.filter(function (x) { return x.id === id; })[0]); S.q.marginOk[id] = r.mk; log('Approval', 'Commercial Director', 'Line ' + id.slice(1) + ' approved at ' + pct(r.gm) + ' gross margin (below ' + MARGIN_APPROVAL + '% threshold)'); toast('Margin exception approved.'); render(); },
  issueOC: function () { S.oc.issued = true; log('Sales', 'Sales Coordinator', 'OC-2026-0418 issued to client'); log('Projects', 'System', 'PRF-0418 Rev A drafted from OC-2026-0418'); toast('OC issued. PRF-0418 drafted.'); go('prf'); },
  releasePRF: function () { S.prf.released = true; log('Projects', 'Projects Manager', 'PRF-0418 Rev A released: 4 lines to production, 2 lines to procurement'); toast('PRF released to Procurement and Production.'); go('procurement'); },
  createPR: function () { S.proc.prs = true; var g = prGroups(); log('Procurement', 'System', g.length + ' purchase requisitions created from net shortages (' + g.map(function (x) { return x.pr; }).join(', ') + ')'); toast(g.length + ' purchase requisitions drafted.'); render(); },
  issuePO: function () { S.proc.pos = true; var g = prGroups(); log('Procurement', 'Procurement Officer', 'POs issued: ' + g.map(function (x) { return x.po; }).join(', ') + ' · ' + aed(g.reduce(function (a, x) { return a + x.val; }, 0))); toast('POs issued. Work orders can be released.'); render(); },
  woRel: function () { var s = S.wo[S.selWo]; if (!S.proc.pos) return; s.rel = true; log('Production', 'Production Supervisor', S.selWo + ' released to floor; materials reserved'); render(); },
  woStep: function () { var w = WO_DEF.filter(function (x) { return x.id === S.selWo; })[0], s = S.wo[w.id]; var hrs = w.std / w.steps.length * (s.step === 1 && w.ws === 'Fusion' ? 1.25 : 1.04); s.hrs += hrs; log('Production', 'Production Supervisor', w.id + ': ' + w.steps[s.step] + ' complete (' + q1(hrs) + ' h)'); s.step++; if (woDone(w.id)) { log('Production', 'QC Inspector', w.id + ' passed final QC; finished goods ready for put-away'); if (w.id === 'WO-0418-01') { S.hu['FG-0418-01'].st = 'Ready for dispatch'; S.hu['FG-0418-01'].loc = 'WH-D01-R01-L01'; } toast(w.id + ' complete.'); } render(); },
  woIssue: function () { var s = S.wo[S.selWo]; s.issued = true; log('Production', 'Storekeeper', 'Materials issued to ' + S.selWo + ' against approved BOM'); render(); },
  woScrap: function () { S.wo[S.selWo].scrap++; log('Production', 'Production Supervisor', S.selWo + ': 1 bar FUS-PRO-001 scrapped (miscut)'); render(); },
  audit: function () { S.drawer = true; render(); },
  closeAudit: function () { S.drawer = false; render(); },
  manItem: function () { var v = (document.getElementById('manItem').value || '').trim().toUpperCase(); scanItem(v); },
  whBack: function () { var W = S.wh; W.err = null; W.step = W.step === 'qty' ? 'loc' : 'item'; render(); },
  whNew: function () { var W = S.wh; W.step = 'item'; W.item = W.loc = null; W.qty = ''; W.err = null; render(); },
  whSubmit: function () {
    var W = S.wh, it = S.hu[W.item], q = parseFloat(document.getElementById('whQty').value), cond = document.getElementById('whCond').value;
    W.qty = isNaN(q) ? '' : q; W.cond = cond;
    if (isNaN(q) || q <= 0) { W.err = ['Enter a quantity', 'Quantity must be more than zero.']; render(); return; }
    if (q > it.qty + 1e-9) { W.err = ['Quantity too high', 'Only ' + q1(it.qty) + ' ' + it.u + ' on this label. Count again or split the bundle.']; render(); return; }
    var from = it.loc || (it.po ? 'Supplier' : '—'), id = 'MV-' + String(26000 + S.audit.length), modeTxt = MODES.filter(function (m) { return m[0] === W.mode; })[0][1];
    var label = W.mode === 'put' ? 'Received and put away' : W.mode === 'move' ? 'Transferred' : W.mode === 'pick' ? 'Issued to production' : 'Dispatched';
    (S.hist[W.item] = S.hist[W.item] || []).push([now(), label + (cond !== 'Good' ? ' (' + cond.toLowerCase() + ')' : ''), from, W.loc, q1(q) + ' ' + it.u, 'Storekeeper']);
    if (W.mode === 'put') { it.po = false; it.st = cond === 'Good' ? 'In stock' : cond; S.proc.received[it.code] = true; }
    if (W.mode === 'pick') { it.st = 'Issued to production'; }
    if (W.mode === 'dsp') { it.st = 'Dispatched'; log('Finance', 'System', 'INV-0418-01 progress invoice raised on dispatch DN-0418-01'); }
    if (W.mode === 'move' && cond !== 'Good') it.st = cond;
    it.loc = W.loc; if (W.mode === 'pick' || W.mode === 'dsp') it.qty = Math.max(0, it.qty - q);
    var txt = q1(q) + ' ' + it.u + ' of ' + W.item + ' · ' + from + ' → ' + W.loc;
    log('Warehouse', 'Storekeeper', modeTxt + ': ' + txt + ' (' + id + ')');
    W.last = { id: id, txt: txt, t: now() }; W.step = 'done'; W.err = null; W.sel = W.item; render();
  },
  ff: function () {
    S.q.hinge = true; S.q.glassOk = true; S.q.marginOk.L5 = S.mk.L5; S.q.approved = true; S.oc.issued = true;
    CHECKS.forEach(function (c) { S.prf.checks[c[0]] = true; }); S.prf.released = true; S.proc.prs = true; S.proc.pos = true;
    var it = S.hu['FUS-PRO-001-B0412']; it.po = false; it.st = 'In stock'; it.loc = 'WH-A03-R02-L04'; S.proc.received['FUS-PRO-001'] = true;
    (S.hist['FUS-PRO-001-B0412'] = []).push([dstr(TODAY) + ' · 08:30', 'Received and put away', 'Supplier', 'WH-A03-R02-L04', '46 bars', 'Storekeeper']);
    WO_DEF.forEach(function (w, i) { var s = S.wo[w.id]; s.rel = true; s.issued = i < 2; s.step = i === 0 ? w.steps.length - 1 : i === 1 ? 2 : 0; s.hrs = w.std / w.steps.length * s.step * 1.08; });
    log('Demo', 'System', 'Fast-forwarded: quotation approved, OC issued, PRF released, POs issued, work orders released');
    S.selWo = 'WO-0418-01'; toast('Fast-forwarded. Complete WO-0418-01 packing, then dispatch FG-0418-01.'); go('production');
  },
  reset: function () { fresh(); toast('Demo reset.'); go('overview'); }
};
function scanItem(code) {
  var W = S.wh;
  if (!S.hu[code]) { W.err = ['Label not recognised', (code || 'Blank code') + ' is not a known item, bundle or pallet label.']; render(); return; }
  W.item = code; W.step = 'loc'; W.err = null; W.sel = code; W.qty = ''; render();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go],[data-act],[data-line],[data-wo],[data-scan],[data-loc],[data-mode]');
  if (!t) return;
  if (t.hasAttribute('data-act')) { var f = A[t.getAttribute('data-act')]; if (f && !t.disabled) f(t); return; }
  if (t.hasAttribute('data-go')) { S.drawer = false; go(t.getAttribute('data-go')); return; }
  if (t.hasAttribute('data-line')) { if (e.target.closest('input')) return; S.selLine = t.getAttribute('data-line'); render(); return; }
  if (t.hasAttribute('data-wo')) { S.selWo = t.getAttribute('data-wo'); render(); return; }
  if (t.hasAttribute('data-scan')) { scanItem(t.getAttribute('data-scan')); return; }
  if (t.hasAttribute('data-loc')) { S.wh.loc = t.getAttribute('data-loc'); S.wh.err = whValidate(); if (!S.wh.err) S.wh.step = 'qty'; render(); return; }
  if (t.hasAttribute('data-mode')) { var W = S.wh; W.mode = t.getAttribute('data-mode'); W.step = 'item'; W.item = W.loc = null; W.err = null; render(); }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-mk')) { var v = parseFloat(t.value); if (!isNaN(v) && v >= 0) { var id = t.getAttribute('data-mk'); S.mk[id] = Math.min(200, Math.round(v)); S.selLine = id; } render(); var el = document.getElementById(t.id); if (el) el.focus(); }
  else if (t.hasAttribute('data-ck')) { S.prf.checks[t.getAttribute('data-ck')] = t.checked; if (t.checked) log('Projects', 'Projects Manager', 'PRF-0418 check complete: ' + CHECKS.filter(function (c) { return c[0] === t.getAttribute('data-ck'); })[0][1]); render(); }
  else if (t.id === 'histSel') { S.wh.sel = t.value; render(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.drawer) { S.drawer = false; render(); }
  if (e.key === 'Enter' && e.target.id === 'manItem') A.manItem();
});

fresh();
var h0 = (location.hash || '').slice(1);
S.view = VIEWS[h0] ? h0 : 'overview';
render();
})();
</script>
